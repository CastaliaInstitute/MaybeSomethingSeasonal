<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Caga Tió (Catalan Christmas log) illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a16207"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- ground -->
  <ellipse cx="512" cy="760" rx="360" ry="120" fill="#e2e8f0" opacity="0.55"/>

  <!-- log body -->
  <g filter="url(#shadow)">
    <rect x="220" y="520" width="620" height="220" rx="110" fill="url(#wood)"/>
    <!-- bark lines -->
    <path d="M280 590 C360 560, 460 560, 540 590" fill="none" stroke="#92400e" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
    <path d="M300 660 C400 630, 520 630, 620 660" fill="none" stroke="#92400e" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
    <path d="M520 620 C600 590, 700 590, 780 620" fill="none" stroke="#92400e" stroke-width="14" stroke-linecap="round" opacity="0.40"/>

    <!-- log end rings (left) -->
    <circle cx="260" cy="630" r="96" fill="#b45309" opacity="0.9"/>
    <circle cx="260" cy="630" r="64" fill="none" stroke="#7c2d12" stroke-width="14" opacity="0.7"/>
    <circle cx="260" cy="630" r="36" fill="none" stroke="#7c2d12" stroke-width="12" opacity="0.55"/>

    <!-- little feet -->
    <rect x="360" y="730" width="72" height="44" rx="18" fill="#9a3412"/>
    <rect x="640" y="730" width="72" height="44" rx="18" fill="#9a3412"/>
  </g>

  <!-- blanket -->
  <g filter="url(#shadow)">
    <path d="M560 520 C640 500, 730 505, 820 540 L820 650 C740 610, 650 600, 560 610 Z" fill="#dc2626"/>
    <path d="M560 548 C640 530, 725 534, 808 565" fill="none" stroke="#fecaca" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- sticks -->
  <g>
    <path d="M330 560 L230 500" stroke="#78350f" stroke-width="20" stroke-linecap="round"/>
    <path d="M330 610 L210 600" stroke="#78350f" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- face -->
  <g>
    <circle cx="450" cy="615" r="16" fill="#0f172a"/>
    <circle cx="520" cy="615" r="16" fill="#0f172a"/>
    <path d="M468 655 C492 675, 520 675, 544 655" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="410" cy="650" r="18" fill="#fb7185" opacity="0.55"/>
    <circle cx="560" cy="650" r="18" fill="#fb7185" opacity="0.55"/>
  </g>

  <!-- barretina (hat) -->
  <g filter="url(#shadow)">
    <path d="M390 520 C400 440, 560 430, 610 520 Z" fill="#b91c1c"/>
    <rect x="382" y="510" width="250" height="38" rx="18" fill="#fca5a5"/>
    <circle cx="610" cy="505" r="20" fill="#fca5a5"/>
  </g>

  <!-- subtle candy trail (playful, non-explicit) -->
  <g opacity="0.95">
    <circle cx="780" cy="700" r="18" fill="#22c55e"/>
    <circle cx="820" cy="720" r="16" fill="#3b82f6"/>
    <circle cx="860" cy="700" r="14" fill="#f59e0b"/>
    <circle cx="835" cy="675" r="12" fill="#a855f7"/>
  </g>

  <!-- label -->
  <text x="512" y="925" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="56" fill="#0f172a" opacity="0.9">
    Caga Tió
  </text>
</svg>
