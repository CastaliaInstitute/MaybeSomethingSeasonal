<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Tiki Christmas: a carved tiki wearing a Santa hat and a flower lei, with palm fronds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="1" stop-color="#ffe4c4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5652a"/>
      <stop offset="1" stop-color="#6b3410"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8323c"/>
      <stop offset="1" stop-color="#b3121e"/>
    </linearGradient>
    <linearGradient id="frond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4caf50"/>
      <stop offset="1" stop-color="#1b7a34"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a2d0c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="48" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="400" cy="110" r="46" fill="#ffcc4d" opacity="0.9"/>

  <!-- palm fronds -->
  <g fill="url(#frond)" stroke="#155f2a" stroke-width="3" stroke-linejoin="round">
    <path d="M256 250 C150 230 90 160 60 80 C120 100 190 160 256 250 Z"/>
    <path d="M256 250 C160 300 90 300 40 260 C110 240 190 240 256 250 Z"/>
    <path d="M256 250 C362 230 422 160 452 80 C392 100 322 160 256 250 Z"/>
    <path d="M256 250 C352 300 422 300 472 260 C402 240 322 240 256 250 Z"/>
  </g>
  <g stroke="#0f4a20" stroke-width="2" fill="none" opacity="0.6">
    <path d="M256 250 C190 200 120 130 70 90"/>
    <path d="M256 250 C322 200 392 130 442 90"/>
    <path d="M256 250 C180 270 110 275 55 262"/>
    <path d="M256 250 C332 270 402 275 457 262"/>
  </g>

  <!-- tiki body -->
  <g filter="url(#shadow)">
    <path d="M166 200 L346 200 L356 470 L156 470 Z" fill="url(#wood)"/>
  </g>
  <!-- wood grain -->
  <g stroke="#4a2408" stroke-width="3" fill="none" opacity="0.45">
    <path d="M186 230 C200 300 190 380 196 455"/>
    <path d="M326 230 C312 300 322 380 316 455"/>
  </g>

  <!-- brow ridge -->
  <path d="M176 262 C210 236 302 236 336 262 L336 284 C302 262 210 262 176 284 Z" fill="#4a2408"/>
  <!-- eyes -->
  <g>
    <ellipse cx="216" cy="306" rx="30" ry="22" fill="#2e1406"/>
    <ellipse cx="296" cy="306" rx="30" ry="22" fill="#2e1406"/>
    <ellipse cx="216" cy="306" rx="18" ry="13" fill="#f6e7c8"/>
    <ellipse cx="296" cy="306" rx="18" ry="13" fill="#f6e7c8"/>
    <circle cx="216" cy="306" r="7" fill="#2e1406"/>
    <circle cx="296" cy="306" r="7" fill="#2e1406"/>
  </g>
  <!-- nose -->
  <path d="M256 322 L238 366 L274 366 Z" fill="#4a2408"/>
  <!-- mouth -->
  <path d="M196 392 C230 430 282 430 316 392 L316 412 C282 452 230 452 196 412 Z" fill="#2e1406"/>
  <g fill="#f6e7c8">
    <rect x="210" y="398" width="16" height="16" rx="2"/>
    <rect x="236" y="404" width="16" height="18" rx="2"/>
    <rect x="262" y="404" width="16" height="18" rx="2"/>
    <rect x="288" y="398" width="16" height="16" rx="2"/>
  </g>

  <!-- lei -->
  <g stroke="#155f2a" stroke-width="6" fill="none">
    <path d="M150 440 C200 505 312 505 362 440"/>
  </g>
  <g>
    <g fill="#ff5c8a"><circle cx="160" cy="445" r="12"/><circle cx="196" cy="472" r="12"/><circle cx="256" cy="488" r="12"/><circle cx="316" cy="472" r="12"/><circle cx="352" cy="445" r="12"/></g>
    <g fill="#ffd54a"><circle cx="178" cy="460" r="10"/><circle cx="226" cy="483" r="10"/><circle cx="286" cy="483" r="10"/><circle cx="334" cy="460" r="10"/></g>
    <g fill="#fff"><circle cx="160" cy="445" r="4"/><circle cx="196" cy="472" r="4"/><circle cx="256" cy="488" r="4"/><circle cx="316" cy="472" r="4"/><circle cx="352" cy="445" r="4"/></g>
  </g>

  <!-- santa hat -->
  <path d="M160 214 C170 120 260 60 372 96 C330 120 300 150 296 214 Z" fill="url(#hat)"/>
  <path d="M296 214 C320 170 350 120 372 96 C380 130 360 170 330 200 Z" fill="#c8202a"/>
  <rect x="146" y="196" width="220" height="36" rx="18" fill="#fff"/>
  <rect x="146" y="196" width="220" height="36" rx="18" fill="none" stroke="#e6e0d6" stroke-width="2"/>
  <circle cx="380" cy="92" r="22" fill="#fff" stroke="#e6e0d6" stroke-width="2"/>

  <!-- hibiscus on hat -->
  <g transform="translate(206 214)">
    <g fill="#ff3b5c">
      <ellipse cx="0" cy="-18" rx="10" ry="16"/>
      <ellipse cx="17" cy="-6" rx="10" ry="16" transform="rotate(72 17 -6)"/>
      <ellipse cx="11" cy="15" rx="10" ry="16" transform="rotate(144 11 15)"/>
      <ellipse cx="-11" cy="15" rx="10" ry="16" transform="rotate(216 -11 15)"/>
      <ellipse cx="-17" cy="-6" rx="10" ry="16" transform="rotate(288 -17 -6)"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="#ffd54a"/>
  </g>

  <!-- string of lights along the hat brim -->
  <g>
    <path d="M150 236 C200 256 312 256 362 236" stroke="#1b5e20" stroke-width="3" fill="none"/>
    <g>
      <ellipse cx="175" cy="248" rx="6" ry="9" fill="#ff4d4d"/>
      <ellipse cx="215" cy="255" rx="6" ry="9" fill="#4dd2ff"/>
      <ellipse cx="256" cy="257" rx="6" ry="9" fill="#ffd54a"/>
      <ellipse cx="297" cy="255" rx="6" ry="9" fill="#6bff6b"/>
      <ellipse cx="337" cy="248" rx="6" ry="9" fill="#ff4d4d"/>
    </g>
  </g>
</svg>
